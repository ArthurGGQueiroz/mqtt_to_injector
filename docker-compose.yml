services:
  # 1. Broker MQTT rodando na EC2
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    networks:
      - iot-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Injetor (consome o MQTT local da EC2 e grava no RDS)
  injector:
    build: .
    container_name: mqtt_injector
    restart: unless-stopped
    depends_on:
      - mosquitto
    # Credenciais do MQTT e do RDS ficam no .env (veja .env.example)
    env_file:
      - .env
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
    networks:
      - iot-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  iot-net:
    driver: bridge
