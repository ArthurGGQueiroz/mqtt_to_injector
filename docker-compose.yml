version: '3.8'

services:
  # 1. Broker MQTT rodando na EC2
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    networks:
      - iot-net

  # 2. Injetor (consome o MQTT local da EC2 e grava no RDS)
  injector:
    build: .
    container_name: mqtt_injector
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - DB_HOST=
      - DB_PORT=5432
      - DB_USER=
      - DB_PASSWORD=
      - DB_NAME=
    networks:
      - iot-net

networks:
  iot-net:
    driver: bridge
